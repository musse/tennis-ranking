<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e4c3b"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/style.css"><title>Quadra — ranking de tênis</title></head>
<body><header><div class="brand"><span class="ball">●</span><div><b>quadra</b><small>RANKING ENTRE AMIGOS</small></div></div><button id="logout" class="quiet hidden">Sair</button></header>
<main><section id="login" class="login card"><div class="eyebrow">BEM-VINDO À QUADRA</div><h1>Seu próximo jogo começa aqui.</h1><p>Entre com a senha compartilhada do grupo.</p><form id="login-form"><label>Senha do grupo<input type="password" id="password" required autocomplete="current-password"></label><button class="primary">Entrar <span>→</span></button><div id="login-error" class="error"></div></form></section>
<section id="app" class="hidden"><div class="topline"><div><div class="eyebrow">SEUS GRUPOS</div><h1>Rankings</h1></div><button id="new-ranking" class="primary">＋ Novo ranking</button></div><div id="ranking-list" class="cards"></div><section id="detail" class="hidden"></section></section></main>
<dialog id="create-dialog"><form id="create-form" method="dialog"><button type="button" class="close" data-close>×</button><div class="eyebrow">NOVO GRUPO</div><h2>Criar ranking</h2><label>Nome do ranking<input id="ranking-name" required placeholder="Ex.: Tênis de sábado"></label><label>Jogadores <small>Adicione todos agora; a lista não poderá ser alterada depois.</small><div id="player-inputs"></div></label><button type="button" id="add-player" class="outline">＋ Adicionar jogador</button><button class="primary full">Criar ranking</button><div id="create-error" class="error"></div></form></dialog>
<dialog id="match-dialog"><form id="match-form" method="dialog"><button type="button" class="close" data-close>×</button><div class="eyebrow">DETALHES DA PARTIDA</div><h2>Agendar jogo</h2><label>Semana (sábado a sexta)<input type="date" id="week-date" required></label><label>Data e horário<input type="datetime-local" id="match-date" required></label><div class="row"><label>Sede<select id="venue"><option value="AP">AP</option><option value="UP">UP</option></select></label><label>Quadra<select id="court"><option value="1">Quadra 1</option><option value="2">Quadra 2</option><option value="3">Quadra 3</option></select></label></div><div class="sets hidden" id="sets-input"><label>Placar por set <small>Games de cada dupla</small></label><div id="set-rows"></div><button type="button" id="add-set" class="outline">＋ Adicionar set</button></div><button class="primary full">Salvar partida</button><div id="match-error" class="error"></div></form></dialog>
<footer>Feito para jogar mais. <span>🎾</span></footer><script src="/app.js"></script></body></html>
